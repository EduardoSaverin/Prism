[project]
name = "prismgw"
dynamic = ["version"]
description = "Prism: an OpenAI-compatible AI gateway with routing, failover, caching, governance and tracing."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "typer>=0.29.1",
]

[project.scripts]
prism = "prism.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.version]
path = "src/prism/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/prism"]

# ---------- Ruff: linting and formatting ----------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B018"]

# ---------- Pyright: type checking ----------
[tool.pyright]
include = ["src", "tests", "scripts"]
exclude = ["src/prism/store/migrations/versions"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
# Core modules get the strictest checks.
strict = ["src/prism/core", "src/prism/providers", "src/prism/plugins"]

# ---------- Pytest and coverage ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
addopts = "-ra --strict-markers --cov=prism --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
source = ["prism"]
omit = ["src/prism/store/migrations/*"]
