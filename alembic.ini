# Used by the "alembic" command. Prism itself runs migrations from code
# (see src/prism/store/migrate.py), so this file only helps during development.
#
#   PRISM_DATABASE_URL=sqlite+aiosqlite:///./prism.db uv run alembic upgrade head
#   uv run alembic revision --autogenerate -m "describe the change"

[alembic]
script_location = src/prism/store/migrations
