# Example Prism config. Copy it to config/prism.yaml and edit.
# Keys are never written here. Each "env" names an environment variable.

providers:
  - id: groq
    kind: groq
    keys:
      - env: GROQ_KEY_1
        weight: 2
      - env: GROQ_KEY_2
        weight: 1
    # US dollars per million tokens, by model name. Unpriced models cost $0.
    # Check the provider's pricing page: prices change.
    prices:
      <model-id>: { input: 0.59, output: 0.79 }

  - id: gemini
    kind: gemini
    keys:
      - env: GEMINI_KEY_1

  - id: local-ollama
    kind: ollama
    base_url: http://localhost:11434
    # Local models are free. A zero price also stops the "no price" warning.
    prices:
      <model-id>: { input: 0, output: 0 }

routes:
  # Callers use the route name as the model name, for example model="fast-chat".
  - name: fast-chat
    policy: priority
    targets:
      - provider: groq
        model: <model-id>
        # Optional: only use some of groq's keys for this target. Default: all of them.
        # keys: [GROQ_KEY_1]
      - provider: gemini
        model: <model-id>
      - provider: local-ollama
        model: <model-id>
    retry:
      max_retries: 2
      backoff_ms: 200
    cache:
      exact: true
      ttl_s: 300
